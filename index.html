<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUSKBOUND</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  <p>Arrows: move / jump &nbsp; Space: attack &nbsp; X: lightning &nbsp; M: music &nbsp; R: restart</p>
  <script>
    (async function loadGameWithAudio() {
      const canvas = document.getElementById("game");
      try {
        const response = await fetch("./game.js");
        if (!response.ok) throw new Error("Could not load game.js (HTTP " + response.status + ")");
        let source = await response.text();

        const injectAfter = (anchor, addition) => {
          if (!source.includes(anchor)) throw new Error("Game audio integration anchor not found");
          source = source.replace(anchor, anchor + "\n" + addition);
        };

        injectAfter(
          "const urlMap = Object.create(null);",
          `const SOUND_FILES = {
            sword: "sound_effects/swordsound.mp3",
            mushroom: "sound_effects/mushrom attack.mp3",
            goblin: "sound_effects/goblin_attack.mp3",
            golemSpawn: "sound_effects/large_monester_apper.mp3",
            golemAttack: "sound_effects/large-monster-attack.mp3",
            gameOver: "sound_effects/gameover.mp3",
          };
          const SOUND_AUDIO = Object.fromEntries(
            Object.entries(SOUND_FILES).map(([name, path]) => {
              const audio = new Audio(encodeURI(path));
              audio.preload = "auto";
              return [name, audio];
            }),
          );
          function playSound(name) {
            const source = SOUND_AUDIO[name];
            if (!source) return;
            try {
              const audio = source.cloneNode();
              audio.volume = 0.75;
              const playback = audio.play();
              if (playback && typeof playback.catch === "function") playback.catch(() => {});
            } catch {}
          }`,
        );

        source = source.replaceAll(
          "assets/lumine wave - Beyond the Blue.mp3",
          "sound_effects/backgroundmusic.mp3",
        ).replaceAll(
          "lumine wave - Beyond the Blue.mp3",
          "sound_effects/backgroundmusic.mp3",
        );

        const replaceOnce = (anchor, replacement) => {
          if (!source.includes(anchor)) throw new Error("Game audio integration anchor not found");
          source = source.replace(anchor, replacement);
        };

        replaceOnce(
          "this.strike(this.anim);",
          'if (this.anim === "attack") playSound("sword");\n      this.strike(this.anim);',
        );
        replaceOnce(
          'this.play("attack", true);\n      this.hitDone = false;\n      this.cd = this.def.cd;',
          'this.play("attack", true);\n      playSound(this.type === "golem" ? "golemAttack" : this.type);\n      this.hitDone = false;\n      this.cd = this.def.cd;',
        );
        replaceOnce(
          "enemies.push(new Enemy(type, x, enemyChars[type]));",
          'enemies.push(new Enemy(type, x, enemyChars[type]));\n  if (type === "golem") playSound("golemSpawn");',
        );
        replaceOnce(
          'state = "lose";\n      endT = 0;',
          'state = "lose";\n      playSound("gameOver");\n      endT = 0;',
        );

        new Function(source)();
      } catch (error) {
        console.error(error);
        const context = canvas && canvas.getContext("2d");
        if (context) {
          context.fillStyle = "#000";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.fillStyle = "#f66";
          context.font = "16px monospace";
          context.fillText("Game load error: " + error.message, 20, 40);
        }
      }
    })();
  </script>
</body>
</html>
